name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Generate data
        run: python -m data.generate --seed 7 --out .data
        env:
          MSG_DATA_DIR: .data
      - name: Test
        run: pytest -q
        env:
          MSG_DATA_DIR: .data
      - name: Adversarial evaluation
        run: python -m eval.harness --out results/ci.jsonl
        env:
          MSG_DATA_DIR: .data
